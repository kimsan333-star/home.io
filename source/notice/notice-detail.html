<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>お知らせ詳細</title>
	<link rel="stylesheet" href="./css/notice_styles.css" />
</head>
<body>
	<main class="app detail" role="application">
		<!-- Header -->
		<header class="topbar" aria-label="ヘッダー">
			<a class="backlink" href="notice-list.html" aria-label="お知らせ一覧に戻る">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<!-- 左矢印：くの字＋シャフト -->
					<polyline points="14,6 8,12 14,18"></polyline>
					<line x1="9" y1="12" x2="20" y2="12"></line>
				</svg>
			</a>
			<button class="menu-btn" id="btnMenu" aria-haspopup="dialog" aria-expanded="false" aria-controls="menuSheet">
				<img src="data:image/svg+xml;utf8,
					<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'>
						<rect y='3' width='20' height='2' fill='%23777'/>
						<rect y='9' width='20' height='2' fill='%23777'/>
						<rect y='15' width='20' height='2' fill='%23777'/>
					</svg>" alt="">
			</button>
		</header>
		<!--div class="brandline" aria-hidden="true"></div-->

		<!-- Main -->
		<div class="main detail-main">
			<div class="detail-scroll">
				<section class="article" id="article">
					<h1 class="article__title" id="artTitle">タイトル</h1>
					<div class="article__meta" id="artMeta">0000-00-00 00:00</div>
					<div class="article__body" id="artBody"></div>
				</section>

				<div class="notice-actions">
					<button id="btnMarkRead" class="btn btn-primary" type="button">既読にする</button>
					<button id="btnMarkUnread" class="btn btn-secondary" type="button">未読に戻す</button>
				</div>
			</div>

			<div class="pager">
				<button id="btnPrev" class="btn btn-secondary">前へ</button>
				<div class="page-indicator" id="pageIndicator">1 / 1</div>
				<button id="btnNext" class="btn btn-primary">次へ</button>
			</div>
		</div>
	</main>

	<!-- Overlay Menu（共通／イメージ準拠） -->
	<div class="overlay" id="overlay" aria-hidden="true">
		<div class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
			<header id="menuTitle">
				<span class="emp-code" id="empCode">32129</span>
				<span class="emp-name" id="empName">夢真 太郎</span>
			</header>
			<ul>
				<li>
					<button class="menuitem" type="button" id="miEmail">
						<div class="menuitem-row">
							<span class="menuicon">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<rect x="3" y="5" width="18" height="14" rx="2"></rect>
									<polyline points="3,7 12,13 21,7"></polyline>
								</svg>
							</span>
							<span>メールアドレス設定</span>
						</div>
						<div class="menuitem-sub" id="empEmail">taro_yumeshin@gmail.com</div>
					</button>
				</li>
				<li>
					<button class="menuitem" type="button" id="miPassword">
						<div class="menuitem-row">
							<span class="menuicon">
								<!-- ★ 鍵アイコン：丸環＋軸＋二段ギザ（より鍵らしく） -->
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<g stroke-linecap="round" stroke-linejoin="round">
										<circle cx="7" cy="12" r="3"></circle>
										<path d="M10 12H20"></path>
										<polyline points="16,12 16,15 18,15"></polyline>
										<polyline points="19,12 19,15 21,15"></polyline>
									</g>
								</svg>
							</span>
							<span>パスワード設定</span>
						</div>
					</button>
				</li>
				<li>
					<button class="menuitem" type="button" id="miLogout">
						<div class="menuitem-row">
							<span class="menuicon">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<rect x="3" y="4" width="10" height="16" rx="2"></rect>
									<path d="M13 12h8"></path>
									<path d="M19 8l4 4-4 4"></path>
								</svg>
							</span>
							<span>ログアウト</span>
						</div>
					</button>
				</li>
			</ul>
		</div>
	</div>

	<script src="./js/overlay_menu.js"></script>
	<script>
		/* ダミープロフィール（実装時はAPIで置換） */
		const PROFILE = { id:"32129", name:"夢真 太郎", email:"taro_yumeshin@gmail.com" };
		document.getElementById('empCode').textContent = PROFILE.id;
		document.getElementById('empName').textContent = PROFILE.name;
		document.getElementById('empEmail').textContent = PROFILE.email;

		/* ダミーデータ */
		const notices = [
			{
				id:1,title:"システムメンテナンスのお知らせ",datetime:"2025-09-19T10:00:00",unread:true,
				body:`<p>平素より社員ポータルをご利用いただき、誠にありがとうございます。<br>以下の日程においてシステムメンテナンスを実施いたします。</p>
				<h3>【メンテナンス日時】</h3><p>2025年9月25日（木） 00:00 ～ 06:00<br>※作業状況により終了時間が前後する場合がございます。</p>
				<h3>【影響範囲】</h3><ul><li>メンテナンス中はポータルサイトにアクセスできません。</li><li>ご不便をおかけいたしますが、ご理解とご協力をお願いいたします。<br><br><br><br>スクロール確認用文字列<br><br><br></li></ul>`
			},
			{ id:2,title:"新機能リリースのお知らせ",datetime:"2025-09-18T09:30:00",unread:false,body:"<p>新しい機能を追加しました。操作マニュアルをご確認ください。</p>" }
		].sort((a,b)=> new Date(b.datetime)-new Date(a.datetime));


		const qs = new URLSearchParams(location.search);
		const id = Number(qs.get('id')) || notices[0].id;
		let idx = Math.max(0, notices.findIndex(n=>n.id===id));
		const total = notices.length;

		// 現在日時描画関数
		function fmtDateTime(iso){
			const d = new Date(iso); const p=n=>String(n).padStart(2,'0');
			return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())
		}${p(d.getHours())}:${p(d.getMinutes())}` }

		const $title = document.getElementById('artTitle');
		const $meta = document.getElementById('artMeta');
		const $body = document.getElementById('artBody');
		const $ind = document.getElementById('pageIndicator');
		const $btnPrev = document.getElementById('btnPrev');
		const $btnNext = document.getElementById('btnNext');
		const $btnRead = document.getElementById('btnMarkRead');
		const $btnUnread = document.getElementById('btnMarkUnread');

		// 既読・未読ボタンの制御関数
		function updateActions() {
			const n = notices[idx];
			$btnRead.disabled =! n.unread;
			$btnUnread.disabled = n.unread;
		}

		// コンテンツ描画関数
		function render() {
			const n = notices[idx];
			$title.textContent = n.title;
			$meta.textContent = fmtDateTime(n.datetime);
			$body.innerHTML = n.body;
			$ind.textContent = `${idx+1} / ${total}`
			$btnPrev.disabled = idx<=0;
			$btnNext.disabled = idx>=total-1;
			const url = new URL(location.href);
			url.searchParams.set('id',n.id);
			history.replaceState(null,'',url);
			updateActions();
		}

		// ボタンの制御
		$btnRead.addEventListener('click',() => {notices[idx].unread=false;updateActions();});
		$btnUnread.addEventListener('click',() => {notices[idx].unread=true;updateActions();});
		$btnPrev.addEventListener('click',() => {if(idx>0){idx--;render();}});
		$btnNext.addEventListener('click',() => {if(idx<total-1){idx++;render();}});

		// 共通オーバーレイメニュー初期化（プロフィールも反映）
		initOverlayMenu({ profile: PROFILE });
		
		// コンテンツ描画開始
		render();
	</script>
</body>
</html>
