<body>
    <header class="header">
        <button class="back-button" onclick="history.back()">←</button>
        <div class="header-title">お知らせ詳細</div>
    </header>

    <div class="content">
        <h2>システムメンテナンスのお知らせ</h2>

            <button id="markRead">既読にする</button>

    <div class="pagination">
